name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup uv
        uses: astral-sh/setup-uv@v10

      - name: Install Python packages
        shell: bash
        run: uv sync --locked

      # The Tiny Tapeout gl_test action installs from test/requirements.txt with pip
      - name: Check test/requirements.txt matches uv.lock
        shell: bash
        run: |
          uv export --no-hashes --no-annotate --format requirements-txt -o test/requirements.txt
          git diff --exit-code test/requirements.txt

      - name: Run tests
        run: |
          cd test
          uv run make clean
          uv run make
          # make will return success even if the tests fail, so check results.xml for failed tests
          uv run python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
